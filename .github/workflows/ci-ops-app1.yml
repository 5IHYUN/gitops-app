# gitops-app/.github/workflows/ci-ops-app1.yml

name: CI ops-app1 (DockerHub)

on:
  push:
    branches: [main]
    paths:
      - "ops-app1/**"
      - ".github/workflows/ci-ops-app1.yml"

env:
  APP_NAME: ops-app1
  DOCKERHUB_IMAGE: shkim5971/ops-app1
  CONFIG_REPO: 5IHYUN/gitops-config
  CONFIG_REPO_PATH: apps/ops-app1/overlays

permissions:
  contents: read

jobs:
  ci:
    name: Build and Push to DockerHub
    runs-on: ubuntu-24.04

    outputs:
      image-tag: ${{ steps.export.outputs.image-tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Maven 테스트
        working-directory: ./ops-app1
        run: mvn test -q

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: DockerHub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 빌드 및 Push
        run: |
          TAG="sha-${GITHUB_SHA::7}"

          docker buildx build \
            --platform linux/arm64 \
            -t ${{ env.DOCKERHUB_IMAGE }}:${TAG} \
            -t ${{ env.DOCKERHUB_IMAGE }}:latest \
            -f ops-app1/Dockerfile \
            ./ops-app1 \
            --push

          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Export image outputs
        id: export
        run: |
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "확인 image-tag=${IMAGE_TAG}"

  update-config:
    name: Update Config Repo
    needs: ci
    runs-on: ubuntu-24.04

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Config Repo 체크아웃
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: config-repo

      - name: Kustomize 설치
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: dev overlay 이미지 업데이트
        run: |
          IMAGE_TAG="${{ needs.ci.outputs.image-tag }}"
          FULL_IMAGE="${{ env.DOCKERHUB_IMAGE }}:${IMAGE_TAG}"

          echo "Updated: ${{ env.APP_NAME }}=${FULL_IMAGE}"

          cd config-repo/${{ env.CONFIG_REPO_PATH }}/dev

          kustomize edit set image ${{ env.APP_NAME }}=${FULL_IMAGE}

          echo "===== 변경 결과 ====="
          cat kustomization.yaml

      - name: Config Repo 커밋·Push
        run: |
          IMAGE_TAG="${{ needs.ci.outputs.image-tag }}"
          FULL_IMAGE="${{ env.DOCKERHUB_IMAGE }}:${IMAGE_TAG}"

          cd config-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --staged --quiet || git commit \
            -m "chore: update ${{ env.APP_NAME }} dev image to ${FULL_IMAGE} [skip ci]"

          git push
